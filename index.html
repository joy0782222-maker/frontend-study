<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <script>
        let a = 10;
        let b = 3;
        console.log(a + b);
        console.log(a - b);
        console.log(a * b);
        console.log(a / b);
        console.log(a % b);

        console.log(a > b);//true
        console.log(a < b);//false
        console.log(a == b);//false
        console.log(a === b);//완전같음
        console.log(a != b);//부정

        let age = 20;
        console.log(age > 18 && age < 30);//true 둘다같아야 함
        console.log(age > 18 || age > 30);//true 하나만 참이어도 됨
        let login = true;
        console.log(!login);//반대
        let count = 5;
        count++
        console.log(count);
        let count2 = 5;
        count2--
        console.log(count2);
        
        
        

    </script>



</body>
</html>
