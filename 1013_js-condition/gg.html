<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: darkslateblue;
            color: white;
            font-size: 16px;
        }
        p{
            text-align: center;
            margin-top: 300px;
        }
        strong{
            color: greenyellow;
            font-size: 32px;
        }
    </style>
</head>
<body>
    

    <script>
        let session = prompt( 
             "관심 세션을 선택해주세요. 1-마케팅,2-개발,3-디자인",
        "1,2,3중에 고르세요",);

            switch(session){
                case '1' : 
                    document.write('<p>마케팅 세션은 <strong>101호</strong>에서 진행합니다.</p>'); break;
                case '2' : 
                    document.write('<p>개발 세션은 <strong>202호</strong>에서 진행합니다.</p>'); break;
                case '3' : 
                    document.write('<p>디자인 세션은 <strong>303호</strong>에서 진행합니다.</p>'); break;
                default : alert('세션을 잘못 선택하셨습니다.'); break;
            }
    </script>
</body>

</html>
