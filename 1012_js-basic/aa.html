<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        span{font-weight: bold;}
    </style>
  </head>
  <body>
    <script>
      let x = 200;
      let y = 50;
      let total = x + y
      let totall = x * y
      //%나머지
      console.log(total);
      console.log(totall);
      document.write(`<p>x + y = ${total}</p>`)
      document.write(`<p>x x y = <span>${totall}</span></p>`)
      
      // 1. banana 변수선언하고 금액을 할당하세요.
      // 2. apple 변수선언하고 금액을 할당하세요.
      // 3. mango 변수선언하고 금액을 할당하세요.
      // 4.  total변수 선언하고 banana apple mango 다 더한 식을 할당하세요
      // 화면에 바나나 사과 망고를 다 더한 금액은 ... 입니다.
      const ba = 100000;
      const ap = 200000;
      const ma = 300000;
      const total1 = ba + ap + ma
      document.write(`<p>${total1.toLocaleString()}</p>`)
      
      let now = new Date()
      console.log(now);
      let display = now.toLocaleDateString()
      console.log(display);
      document.write(`<p>오늘 날짜 : ${now}</p>`)
      document.write(`<p>오늘 날짜 : ${display}</p>`)
      let displayTime = now.toLocaleTimeString()
      document.write(`<p>오늘 시간 : ${displayTime}</p>`)

    </script>

  </body>
</html>
